name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Early rust gate (sandbox has no crates.io access, so GitHub Actions is the
  # verify environment for Rust until the full P0-T04 CI lands with Fedora
  # rpm containers, cargo-deny, and the §1.7 manifest check).
  # Diagnostics are emitted as ::error:: annotations because the sandbox
  # cannot download run logs from blob storage.
  rust:
    name: Rust (clippy + tests + parity gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install clippy + rustfmt
        run: rustup component add clippy rustfmt

      - name: Clippy
        id: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: pw-core contract tests
        id: pwcore
        run: |
          set +e
          cargo test -p pw-core > /tmp/pwcore.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "pw-core cargo test exit: $?"
          exit 0

      - name: pw-engine parity gate (50 expected failures until P3-T01)
        id: parity
        run: |
          set +e
          bash ../scripts/check-engine-expected-failures.sh > /tmp/parity.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report diagnostics + final status
        run: |
          s_clippy="${{ steps.clippy.outputs.status }}"
          s_pwcore="${{ steps.pwcore.outputs.status }}"
          s_parity="${{ steps.parity.outputs.status }}"
          {
            echo "## CI diagnostics"
            echo ""
            echo "| step | status |"
            echo "|------|--------|"
            echo "| clippy | $s_clippy |"
            echo "| pw-core tests | $s_pwcore |"
            echo "| parity gate | $s_parity |"
            echo ""
            echo '```text'
            grep -E "^error(\[|:)" -A 8 /tmp/clippy.log | head -160 || true
            echo "--- pw-core test tail ---"
            tail -n 30 /tmp/pwcore.log || true
            echo "--- parity gate tail ---"
            tail -n 30 /tmp/parity.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # annotations (readable via the checks API from the sandbox)
          printf '::error::statuses clippy=%s pwcore=%s parity=%s\n' "$s_clippy" "$s_pwcore" "$s_parity" || true
          printf '::error::=== clippy.log errors ===\n' || true
          { grep -E "^error" -A 5 /tmp/clippy.log | head -60; } | while read -r line; do
            printf '::error::%s\n' "${line:0:400}"
          done || true
          printf '::error::=== pwcore.log tail ===\n' || true
          tail -n 80 /tmp/pwcore.log | while read -r line; do
            printf '::error::%s\n' "${line:0:400}"
          done || true
          printf '::error::=== pwcore summaries/failures ===\n' || true
          { grep -nE "test result|^failures:|^    [a-z_]+::|panicked at|FAILED" /tmp/pwcore.log | head -40; } | while read -r line; do
            printf '::error::%s\n' "${line:0:400}"
          done || true
          printf '::error::=== parity.log tail ===\n' || true
          tail -n 15 /tmp/parity.log | while read -r line; do
            printf '::error::%s\n' "${line:0:400}"
          done || true

          if [ "$s_clippy" = "0" ] && [ "$s_pwcore" = "0" ] && [ "$s_parity" = "0" ]; then
            echo "ALL RUST GATES GREEN"
            exit 0
          fi
          exit 1
