name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Early rust gate (sandbox has no crates.io access, so GitHub Actions is the
  # verify environment for Rust until the full P0-T04 CI lands with Fedora
  # rpm containers, cargo-deny, and the §1.7 manifest check).
  # Diagnostics are emitted as ::error:: annotations because the sandbox
  # cannot download run logs from blob storage.
  rust:
    name: Rust (clippy + tests + parity gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install clippy + rustfmt
        run: rustup component add clippy rustfmt

      - name: Clippy
        id: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: pw-core contract tests
        id: pwcore
        run: |
          set +e
          cargo test -p pw-core > /tmp/pwcore.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "pw-core cargo test exit: $?"
          exit 0

      - name: pw-engine parity gate (50 expected failures until P3-T01)
        id: parity
        run: |
          set +e
          bash ../scripts/check-engine-expected-failures.sh > /tmp/parity.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: cargo-deny (licenses + sources)
        id: deny
        run: |
          set +e
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/latest/download/cargo-deny-x86_64-unknown-linux-musl.tar.gz -o /tmp/deny.tgz
          tar -xzf /tmp/deny.tgz -C /tmp
          /tmp/cargo-deny-x86_64-unknown-linux-musl/cargo-deny check licenses sources > /tmp/deny.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report diagnostics + final status
        run: |
          s_clippy="${{ steps.clippy.outputs.status }}"
          s_pwcore="${{ steps.pwcore.outputs.status }}"
          s_parity="${{ steps.parity.outputs.status }}"
          s_deny="${{ steps.deny.outputs.status }}"
          {
            echo "## CI diagnostics"
            echo ""
            echo "| step | status |"
            echo "|------|--------|"
            echo "| clippy | $s_clippy |"
            echo "| pw-core tests | $s_pwcore |"
            echo "| parity gate | $s_parity |"
            echo ""
            echo '```text'
            grep -E "^error(\[|:)" -A 8 /tmp/clippy.log | head -160 || true
            echo "--- pw-core test tail ---"
            tail -n 30 /tmp/pwcore.log || true
            echo "--- parity gate tail ---"
            tail -n 30 /tmp/parity.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # annotations (readable via the checks API from the sandbox)
          printf '::error::statuses clippy=%s pwcore=%s parity=%s\n' "$s_clippy" "$s_pwcore" "$s_parity" || true
          printf '::error::=== clippy.log errors ===\n' || true
          { grep -E "^error" -A 5 /tmp/clippy.log | head -60; } | while read -r line; do
            printf '::error::%s\n' "${line:0:400}"
          done || true
          printf '::error::=== failing-gate tails (full logs on the ci-logs branch) ===\n' || true
          if [ "$s_pwcore" != "0" ]; then
            tail -n 25 /tmp/pwcore.log | while read -r line; do printf '::error::%s\n' "${line:0:400}"; done || true
          fi
          if [ "$s_parity" != "0" ]; then
            tail -n 10 /tmp/parity.log | while read -r line; do printf '::error::%s\n' "${line:0:400}"; done || true
          fi

          if [ "$s_deny" != "0" ]; then
            tail -n 15 /tmp/deny.log | while read -r line; do printf '::error::%s\n' "${line:0:400}"; done || true
          fi
          if [ "$s_clippy" = "0" ] && [ "$s_pwcore" = "0" ] && [ "$s_parity" = "0" ] && [ "$s_deny" = "0" ]; then
            echo "ALL RUST GATES GREEN"
            exit 0
          fi
          exit 1

      # Debugging channel: the sandbox cannot download run logs from blob
      # storage, so failed-run logs are pushed to the scratch `ci-logs`
      # branch (force-updated every run; never merged).
      - name: Push raw logs to ci-logs branch
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-log-bot"
          git config user.email "actions@localhost"
          git checkout --orphan ci-logs-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs
          cp /tmp/clippy.log logs/ 2>/dev/null || true
          cp /tmp/pwcore.log logs/ 2>/dev/null || true
          cp /tmp/parity.log logs/ 2>/dev/null || true
          cp /tmp/deny.log logs/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} (${GITHUB_SHA})" > logs/meta.txt
          git add -A
          git commit -m "ci logs for run ${GITHUB_RUN_ID}"
          git branch -M ci-logs
          git push --force origin ci-logs

  # P0-T03 verify: the Tauri shell compiles (clippy-strict) and the IPC
  # contract fixtures round-trip (tests/contracts.rs).
  app:
    name: App shell (clippy + contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Install clippy
        run: rustup component add clippy

      - name: Clippy (strict)
        id: clippy
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > /tmp/app-clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Contract + unit tests
        id: tests
        run: |
          set +e
          cargo test > /tmp/app-test.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report diagnostics + final status
        run: |
          s_clippy="${{ steps.clippy.outputs.status }}"
          s_tests="${{ steps.tests.outputs.status }}"
          printf '::error::app statuses clippy=%s tests=%s\n' "$s_clippy" "$s_tests" || true
          { grep -E "^error" -A 5 /tmp/app-clippy.log | head -60; } | while read -r line; do
            printf '::error::%s\n' "${line:0:400}"
          done || true
          if [ "$s_tests" != "0" ]; then
            tail -n 25 /tmp/app-test.log | while read -r line; do printf '::error::%s\n' "${line:0:400}"; done || true
          fi
          if [ "$s_clippy" = "0" ] && [ "$s_tests" = "0" ]; then
            echo "APP GATES GREEN"
            exit 0
          fi
          exit 1

      - name: Push raw logs to ci-logs branch
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-log-bot"
          git config user.email "actions@localhost"
          git checkout --orphan ci-logs-app-tmp
          git rm -rf --quiet . 2>/dev/null || true
          mkdir -p logs
          cp /tmp/app-clippy.log logs/ 2>/dev/null || true
          cp /tmp/app-test.log logs/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} (${GITHUB_SHA})" > logs/meta.txt
          git add -A
          git commit -m "ci logs (app) for run ${GITHUB_RUN_ID}"
          git branch -M ci-logs
          git push --force origin ci-logs

  # P0-T03 verify: UI skeleton typechecks and builds (pnpm lockfile frozen).
  ui:
    name: UI (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir ui typecheck

      - name: Build
        run: pnpm --dir ui build

  # P0-T04: §1.7 guard — frozen manifests change only via contract: commits.
  manifest-check:
    name: Manifest contract guard (§1.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check push range
        run: |
          bash scripts/check-manifest-contract.sh "${{ github.event.before }}" "${{ github.sha }}"

  # P0-T04: the shippable artifact — pw-backtest rpm on the target Fedora
  # releases (43 primary, 42 compat). Full `tauri build` in real containers.
  rpm:
    name: rpm (Fedora ${{ matrix.fc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fc: ["42", "43"]
    container:
      image: quay.io/fedora/fedora:${{ matrix.fc }}
    steps:
      - name: Install toolchain + Tauri Linux deps
        run: |
          dnf install -y git nodejs npm rust cargo gcc gcc-c++ make pkg-config \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel openssl-devel
          npm install -g pnpm@9.15.0

      - uses: actions/checkout@v4

      - name: Build rpm (pnpm --dir ui tauri build)
        run: pnpm --dir ui tauri build

      - name: Show bundle output
        run: ls -la app/src-tauri/target/release/bundle/rpm/

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pw-backtest-fedora-${{ matrix.fc }}-rpm
          path: app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
